name: Publish to npm

# 태그 X.Y.Z 푸시 또는 수동 실행 → npm에 @nudgeon/react-native 게시 (provenance 포함).
# 시크릿 NPM_TOKEN = npmjs.com → Access Tokens → Granular(또는 Automation) 토큰, 패키지 publish 권한.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: 검증 · npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 시크릿 확인
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::NPM_TOKEN 시크릿이 없습니다 — npmjs.com → Access Tokens (publish 권한) 등록 후 재실행"
            exit 1
          fi

      - name: 태그 = package.json 버전 확인
        if: github.ref_type == 'tag'
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$V" = "$GITHUB_REF_NAME" ] || { echo "::error::태그 $GITHUB_REF_NAME ≠ package.json $V"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 이미 게시된 버전이면 건너뜀
        id: exists
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@nudgeon/react-native@$V" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::@nudgeon/react-native@$V 는 이미 npm에 있습니다"
          fi

      - name: npm publish
        if: steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
